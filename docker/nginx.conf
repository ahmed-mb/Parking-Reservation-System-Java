worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml;

    # Upstream for Spring Boot backend
    upstream backend {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # -------------------------------------------------------
        # Loading page: served while backend is starting up
        # Once /api/config returns 200, the loading page redirects
        # to the React app at /
        # -------------------------------------------------------

        # API requests -> proxy to Spring Boot backend
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;

            # If backend is not ready, return 502 (loading page JS handles this)
            proxy_intercept_errors on;
            error_page 502 503 504 =503 @backend_not_ready;
        }

        # Actuator health endpoint -> proxy to backend
        location /actuator/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 503 504 =503 @backend_not_ready;
        }

        # Backend not ready fallback
        location @backend_not_ready {
            return 503 '{"status":"starting"}';
            add_header Content-Type application/json;
        }

        # Loading page - direct access
        location = /loading {
            try_files /loading.html =404;
        }

        # Static assets (JS, CSS, images from Vite build)
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Images
        location /images/ {
            try_files $uri =404;
            expires 1y;
        }

        # React SPA: All other routes -> index.html
        # This lets React Router handle client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
