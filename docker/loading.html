<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking System - Starting Up</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 480px;
            padding: 40px 24px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            margin: 0 auto 32px;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 12px 40px rgba(102, 126, 234, 0.6); }
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #a0a0b8;
            font-size: 15px;
            margin-bottom: 40px;
        }

        /* Progress Section */
        .progress-section {
            margin-bottom: 36px;
        }

        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Steps */
        .steps {
            text-align: left;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            font-size: 14px;
            color: #666;
            transition: color 0.3s;
        }

        .step.active {
            color: #a0a0b8;
        }

        .step.done {
            color: #4fc3f7;
        }

        .step-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .step.active .step-icon {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .step.done .step-icon {
            border-color: #4fc3f7;
            background: rgba(79, 195, 247, 0.15);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid transparent;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .checkmark::after {
            content: '\2713';
            color: #4fc3f7;
        }

        /* Status */
        .status-text {
            color: #667eea;
            font-size: 13px;
            margin-top: 8px;
            min-height: 20px;
        }

        .error-text {
            color: #ef5350;
            font-size: 13px;
            margin-top: 16px;
        }

        /* Timer */
        .timer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.08);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #a0a0b8;
        }

        /* Background particles */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            from { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            to { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Background particles -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="logo">P</div>
        <h1>Parking Reservation System</h1>
        <p class="subtitle">Initializing your demo environment...</p>

        <div class="progress-section">
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>

            <div class="steps">
                <div class="step active" id="step1">
                    <div class="step-icon"><div class="spinner"></div></div>
                    <span>Starting application server</span>
                </div>
                <div class="step" id="step2">
                    <div class="step-icon"></div>
                    <span>Initializing database</span>
                </div>
                <div class="step" id="step3">
                    <div class="step-icon"></div>
                    <span>Setting up parking spots</span>
                </div>
                <div class="step" id="step4">
                    <div class="step-icon"></div>
                    <span>Ready to go!</span>
                </div>
            </div>
        </div>

        <div class="status-text" id="statusText">Waiting for backend to start...</div>
        <div class="error-text" id="errorText" style="display:none"></div>
    </div>

    <script>
        const steps = ['step1', 'step2', 'step3', 'step4'];
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const errorText = document.getElementById('errorText');
        
        let currentStep = 0;
        let attempts = 0;
        const maxAttempts = 60; // 60 * 2s = 2 minutes max wait
        const startTime = Date.now();

        function updateStep(index) {
            steps.forEach((stepId, i) => {
                const el = document.getElementById(stepId);
                const icon = el.querySelector('.step-icon');
                
                if (i < index) {
                    el.className = 'step done';
                    icon.innerHTML = '<span class="checkmark"></span>';
                } else if (i === index) {
                    el.className = 'step active';
                    icon.innerHTML = '<div class="spinner"></div>';
                } else {
                    el.className = 'step';
                    icon.innerHTML = '';
                }
            });
            
            progressBar.style.width = Math.min((index / steps.length) * 100 + 10, 100) + '%';
        }

        async function checkHealth() {
            try {
                const res = await fetch('/api/config');
                
                if (res.ok) {
                    // Backend is ready
                    updateStep(1);
                    statusText.textContent = 'Database initialized...';
                    
                    await new Promise(r => setTimeout(r, 500));
                    updateStep(2);
                    statusText.textContent = 'Parking spots configured...';
                    
                    await new Promise(r => setTimeout(r, 500));
                    updateStep(3);
                    statusText.textContent = 'Almost ready...';
                    
                    await new Promise(r => setTimeout(r, 300));
                    progressBar.style.width = '100%';
                    
                    steps.forEach(stepId => {
                        const el = document.getElementById(stepId);
                        const icon = el.querySelector('.step-icon');
                        el.className = 'step done';
                        icon.innerHTML = '<span class="checkmark"></span>';
                    });
                    
                    statusText.textContent = 'Redirecting to application...';
                    
                    await new Promise(r => setTimeout(r, 800));
                    window.location.href = '/';
                    return;
                }
            } catch (e) {
                // Backend not ready yet
            }

            attempts++;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            statusText.textContent = `Waiting for backend to start... (${elapsed}s)`;
            
            // Simulate progress within step 1
            if (attempts < 5) {
                progressBar.style.width = (attempts * 3) + '%';
            } else if (attempts < 15) {
                updateStep(0);
                progressBar.style.width = (15 + attempts) + '%';
                statusText.textContent = `Starting Spring Boot application... (${elapsed}s)`;
            } else if (attempts < 30) {
                progressBar.style.width = (30 + attempts) + '%';
                statusText.textContent = `Loading dependencies... (${elapsed}s)`;
            }

            if (attempts >= maxAttempts) {
                errorText.style.display = 'block';
                errorText.textContent = 'The application is taking longer than expected. Please refresh the page.';
                return;
            }

            setTimeout(checkHealth, 2000);
        }

        // Create background particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 15; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 12) + 's';
                p.style.animationDelay = Math.random() * 8 + 's';
                p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
                container.appendChild(p);
            }
        }

        createParticles();
        
        // Start health checking
        setTimeout(checkHealth, 1000);
    </script>
</body>
</html>
