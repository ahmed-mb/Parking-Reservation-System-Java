name: Release

# Triggered only when a tag matching v* is pushed (e.g. `git tag v1.0.0 && git push --tags`).
# That gate is intentional: this workflow publishes a Docker image, signs it
# with cosign, and creates a GitHub Release. None of those should happen on
# every commit to main.
on:
  push:
    tags:
      - 'v*'

# Permissions follow least-privilege:
#   contents: write    -> create the GitHub Release and upload assets
#   packages: write    -> push the image to GitHub Container Registry (ghcr.io)
#   id-token: write    -> request an OIDC token for keyless cosign signing
#                         (no key material stored anywhere; the signature is
#                          bound to "this workflow ran in this repo").
permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build, sign, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Stage frontend dist into backend static resources
        run: |
          mkdir -p src/main/resources/static
          cp -r frontend/dist/* src/main/resources/static/

      - name: Build JAR + SBOM (skip tests; CI already ran them)
        run: mvn -B package -DskipTests --file pom.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign the published image (keyless, OIDC-bound)
        # `cosign sign --yes` agrees to publish the signature to the public
        # transparency log (Rekor). The identity that signs the image is
        # GitHub Actions' OIDC token, which buyers can verify with:
        #   cosign verify ghcr.io/<owner>/parking-reservation-system:<tag> \
        #       --certificate-identity-regexp 'github.com/<owner>/parking-reservation-system' \
        #       --certificate-oidc-issuer https://token.actions.githubusercontent.com
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
            echo "Signing $tag@${{ steps.build.outputs.digest }}"
            cosign sign --yes \
              "${tag%%:*}@${{ steps.build.outputs.digest }}"
          done

      - name: Attach SBOM as an attestation
        # An attestation is a signed claim *about* the image (in this case:
        # "here is the SBOM for this digest"). Buyers can fetch it with:
        #   cosign download attestation ghcr.io/.../parking-reservation-system@<digest>
        run: |
          cosign attest --yes \
            --predicate target/bom.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Create GitHub Release with JAR and SBOM
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/*.jar
            target/bom.json
            target/generated-sources/license/THIRD-PARTY.txt
