name: CI

# Cancel older runs of the same branch when a new push lands. Saves CI minutes
# and avoids stale "passed" status checks coming back after the head moved.
# EXCEPT on main: a main run may be mid-deploy, and cancelling a deploy
# half-way is worse than letting it finish before the next one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  # GHCR image name must be lowercase; the repo name isn't, so spell it out.
  IMAGE_NAME: ghcr.io/ahmed-mb/parking-reservation-system-java

permissions:
  # Default: read everything, write nothing. Individual jobs request more
  # only when they need it (e.g. SARIF upload).
  contents: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------
  # Secret scan: catches accidentally-committed API keys, JWT secrets,
  # database passwords, etc. Runs first because it's cheap and fails fast.
  # ----------------------------------------------------------------------
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan every commit, not just HEAD.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The .gitleaks.toml at the repo root extends the default rules with
          # an allow-list for documented test/demo placeholders.
          GITLEAKS_CONFIG: .gitleaks.toml

  # ----------------------------------------------------------------------
  # Backend: unit + integration tests, JaCoCo coverage, license scan,
  # CycloneDX SBOM. `mvn verify` runs everything bound to the verify phase,
  # which now includes all three.
  # ----------------------------------------------------------------------
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run Maven verify (tests, coverage gate, license check, SBOM)
        run: mvn -B verify --file pom.xml
        env:
          SPRING_PROFILES_ACTIVE: test
          # Testcontainers reuse for faster reruns when running locally.
          TESTCONTAINERS_REUSE_ENABLE: 'true'

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: target/site/jacoco/
          retention-days: 7

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: target/bom.json
          retention-days: 30

      - name: Upload third-party license report
        uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: target/generated-sources/license/THIRD-PARTY.txt
          retention-days: 30
        if: always()

  # ----------------------------------------------------------------------
  # Frontend: unit tests with vitest + coverage.
  # ----------------------------------------------------------------------
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # --omit=dev limits the scan to runtime deps that ship in the bundle.
        # esbuild, vite, vitest etc. are devDependencies and never reach
        # production, so their advisories are tracked but don't gate releases.
        # --audit-level=high fails the build on HIGH or CRITICAL only.
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ----------------------------------------------------------------------
  # Build: produces the deployable JAR. Skipped tests because the test
  # job above already runs them; this job is solely for the artifact.
  # ----------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, lint, secret-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend build to backend
        run: |
          mkdir -p src/main/resources/static
          cp -r frontend/dist/* src/main/resources/static/

      - name: Build backend JAR (skip tests, already run)
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: parking-system-jar
          path: target/*.jar
          retention-days: 7

      - name: Upload SBOM alongside the JAR
        uses: actions/upload-artifact@v7
        with:
          name: parking-system-sbom
          path: target/bom.json
          retention-days: 30

  # ----------------------------------------------------------------------
  # Container image: build the production Dockerfile, run Trivy against
  # the resulting image (fail on CRITICAL CVEs), and — on pushes to main
  # only — publish the exact scanned image to GHCR. The deploy job below
  # then ships that artifact by tag, so what runs in production is
  # byte-for-byte what passed the scan (build once, deploy that).
  # ----------------------------------------------------------------------
  container-scan:
    name: Docker Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      security-events: write
      # Needed to push the scanned image to ghcr.io on main.
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (load into local Docker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: parking-system:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (build-failing scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'parking-system:scan'
          format: 'table'
          # Build-blocking severity: CRITICAL only. HIGH is still surfaced
          # via the SARIF upload below (visible on the Security tab) but
          # does not block releases. This matches the practice of B2B
          # teams who want a real stop-ship gate without permanent CI
          # red on every transitive HIGH advisory. Tighten back to
          # 'HIGH,CRITICAL' once dependency hygiene is fully caught up.
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          # Don't surface dev-only test deps that the runtime doesn't include.
          vuln-type: 'os,library'

      - name: Re-run Trivy in SARIF mode (for GitHub Security tab)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'parking-system:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          # SARIF includes BOTH severities so HIGHs are visible and
          # tracked on the Security tab even though they don't fail
          # the build. exit-code: 0 means "report, don't block".
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-image'

      # ------------------------------------------------------------------
      # Publish the scanned image (main pushes only). These steps run only
      # if every step above succeeded, so a CRITICAL CVE blocks the push.
      # ------------------------------------------------------------------
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          # Retag the exact image Trivy just scanned — no rebuild.
          docker tag parking-system:scan "$IMAGE_NAME:sha-$SHORT_SHA"
          docker tag parking-system:scan "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:sha-$SHORT_SHA"
          docker push "$IMAGE_NAME:latest"

  # ----------------------------------------------------------------------
  # Deploy: main pushes only, and ONLY after every job above has passed
  # (needs: container-scan pulls in the whole graph transitively). The
  # server side is an SSH forced command running deploy-parking.sh, which
  # pulls the image tag we pass, health-checks the new container, and
  # rolls back to the previous image if it fails to come up.
  # ----------------------------------------------------------------------
  deploy:
    name: Deploy to hal-server
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [container-scan]
    concurrency:
      # Never overlap or cancel deploys; a second merge queues behind.
      group: deploy-hal-server
      cancel-in-progress: false
    environment:
      name: production
      url: https://hal-server-832612.tail27051c.ts.net/
    steps:
      - name: Trigger pull-based deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is bound to a forced command server-side; the tag
          # argument reaches the script via SSH_ORIGINAL_COMMAND.
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              "deploy sha-${GITHUB_SHA::7}"
