# Test Configuration
# Note: spring.profiles.active is set via @ActiveProfiles annotation

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable H2 Console in tests
spring.h2.console.enabled=false

# JWT Configuration for Tests
jwt.secret=TestSecretKeyForJWTTokenGenerationMustBeLongEnoughForHS256Algorithm!
jwt.expiration=86400000

# reCAPTCHA - Demo mode bypasses verification
demo.mode=true
recaptcha.secret-key=test-secret-key

# Admin default password for tests
admin.default-password=Admin@123

# Disable unnecessary features in tests
spring.jpa.open-in-view=false

# Logging - reduce noise in tests
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
