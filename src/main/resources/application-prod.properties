# =====================================================
# PRODUCTION CONFIGURATION
# =====================================================
# ALL secrets MUST be set via environment variables.
# This file should NOT contain any actual secret values.

# SQL Server Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:sqlserver://localhost:1433;databaseName=ParkingDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# H2 Console - DISABLED in production
spring.h2.console.enabled=false

# Server Configuration
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# =====================================================
# SECURITY CONFIGURATION (via environment variables)
# =====================================================
# REQUIRED environment variables:
#   JWT_SECRET - Cryptographically secure random string (256+ bits)
#   DATABASE_USERNAME - Database user
#   DATABASE_PASSWORD - Database password
#   RECAPTCHA_SITE_KEY - reCAPTCHA v3 site key
#   RECAPTCHA_SECRET_KEY - reCAPTCHA v3 secret key
#   ADMIN_DEFAULT_PASSWORD - Strong initial admin password

# JWT Configuration - REQUIRED from environment
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# reCAPTCHA Configuration - REQUIRED from environment
recaptcha.site-key=${RECAPTCHA_SITE_KEY}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}

# Admin default password - REQUIRED from environment
admin.default.password=${ADMIN_DEFAULT_PASSWORD}

# =====================================================
# LOGGING - Production settings
# =====================================================
logging.level.root=WARN
logging.level.com.ahmedbahaj.parking=INFO
logging.level.org.springframework.security=WARN
logging.file.name=logs/parking-system.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# =====================================================
# ACTUATOR - Secured for production
# =====================================================
# Minimal exposure, no details to unauthenticated users
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/internal/actuator
management.server.port=${MANAGEMENT_PORT:8081}

# Swagger - Disabled in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
