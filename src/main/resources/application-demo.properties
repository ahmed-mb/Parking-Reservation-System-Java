# =====================================================
# DEMO CONFIGURATION
# =====================================================
# This profile is used for Docker demo deployments.
# reCAPTCHA is bypassed, and demo credentials are used.

# H2 In-Memory Database (resets on restart)
spring.datasource.url=jdbc:h2:mem:parkingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console - Disabled in demo
spring.h2.console.enabled=false

# Server Configuration - Railway sets PORT env var
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:DemoSecretKeyForJWTTokenGeneration2024MustBeLongEnough!}
jwt.expiration=900000

# Demo mode flag - bypasses reCAPTCHA verification
demo.mode=true

# reCAPTCHA - Not used in demo mode but still configured
recaptcha.site-key=demo-not-used
recaptcha.secret-key=demo-not-used

# Admin credentials for demo
admin.default.password=${ADMIN_DEFAULT_PASSWORD:Admin@123}

# Logging - minimal for demo
logging.level.root=WARN
logging.level.com.ahmedbahaj.parking=INFO
logging.level.org.springframework.security=WARN

# Actuator - health only for loading page
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS - allow all origins for demo
cors.allowed-origins=${CORS_ORIGINS:*}

# Swagger - disabled in demo
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Session timeout hint (container will be killed after 15 min)
demo.session.timeout=15
