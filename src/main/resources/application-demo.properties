# =====================================================
# DEMO CONFIGURATION
# =====================================================
# This profile is used for Docker demo deployments. Demo credentials
# (ADMIN_DEFAULT_PASSWORD) are used, but reCAPTCHA is fully enforced same
# as prod — RecaptchaService no longer has a demo-mode bypass. You MUST
# register a real reCAPTCHA v3 site for whatever domain this is deployed
# to (e.g. your Tailscale Funnel hostname) and set RECAPTCHA_SITE_KEY /
# RECAPTCHA_SECRET_KEY, or every login/register will fail closed.

# H2 In-Memory Database (resets on restart)
spring.datasource.url=jdbc:h2:mem:parkingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console - Disabled in demo
spring.h2.console.enabled=false

# Server Configuration - the host platform may set PORT (e.g. a PaaS); falls back to 8080
server.port=${PORT:8080}

# JWT Configuration
# IMPORTANT: JWT_SECRET MUST be supplied at deploy time. The previous
# fallback hard-coded a literal secret in the repo, which would let anyone
# with access to source forge admin tokens. The fallback below is a per-boot
# random UUID pair (~64 chars) so that a misconfigured demo at least cannot
# be impersonated using a known secret.
jwt.secret=${JWT_SECRET:#{T(java.util.UUID).randomUUID().toString() + T(java.util.UUID).randomUUID().toString()}}
jwt.expiration=900000

# Demo mode flag - controls UI/session-timeout hints only (see ConfigController).
# Does NOT bypass reCAPTCHA; that bypass was removed from RecaptchaService.
demo.mode=true

# reCAPTCHA - REQUIRED, no default. Register a real site for the demo domain.
recaptcha.site-key=${RECAPTCHA_SITE_KEY}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}

# Admin credentials for demo
admin.default.password=${ADMIN_DEFAULT_PASSWORD:Admin@123}

# Logging - minimal for demo
logging.level.root=WARN
logging.level.com.ahmedbahaj.parking=INFO
logging.level.org.springframework.security=WARN

# Actuator - health only for loading page
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS - allow all origins for demo
cors.allowed-origins=${CORS_ORIGINS:*}

# Swagger - disabled in demo
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Session timeout hint (container will be killed after 15 min)
demo.session.timeout=15
