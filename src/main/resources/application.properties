# =====================================================
# DEVELOPMENT CONFIGURATION
# =====================================================
# This file is for local development only.
# In production, use environment variables for ALL secrets.

# H2 Database Configuration (For Testing/Demo ONLY)
spring.datasource.url=jdbc:h2:mem:parkingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console - DISABLED by default for security
# Only enable for local debugging when needed
spring.h2.console.enabled=false

# Server Configuration
server.port=8080

# =====================================================
# SECURITY CONFIGURATION
# =====================================================
# IMPORTANT: In production, set these via environment variables:
#   JWT_SECRET - A cryptographically secure random string (256+ bits)
#   RECAPTCHA_SITE_KEY - Your reCAPTCHA v3 site key
#   RECAPTCHA_SECRET_KEY - Your reCAPTCHA v3 secret key
#   ADMIN_DEFAULT_PASSWORD - A strong initial admin password

# JWT Configuration - MUST be set via environment variable in production.
# The dev fallback used to be a static literal; replaced with a per-boot
# random secret so a forgotten environment variable cannot still ship a
# known signing key. Production and demo profiles must always set JWT_SECRET.
jwt.secret=${JWT_SECRET:#{T(java.util.UUID).randomUUID().toString() + T(java.util.UUID).randomUUID().toString()}}
jwt.expiration=86400000

# Google reCAPTCHA Configuration
# Get your keys from: https://www.google.com/recaptcha/admin
recaptcha.site-key=${RECAPTCHA_SITE_KEY:6LcvSh0aAAAAALmTghQPJoYv-KjmiyLSvQV8E1zs}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:6LcvSh0aAAAAAOjqUONtDVtXiA7nOOTgxX6LvGAo}

# Default admin password (MUST be changed in production)
admin.default.password=${ADMIN_DEFAULT_PASSWORD:admin}

# Demo mode - disabled by default (enable via application-demo.properties)
demo.mode=false

# Logging
logging.level.org.springframework.security=DEBUG

# =====================================================
# ACTUATOR - Secured Configuration
# =====================================================
# Only expose minimal endpoints, require authentication for details
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.info.enabled=true

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
