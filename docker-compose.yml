# =============================================================================
# Docker Compose for Parking Reservation System
# =============================================================================
# Usage:
#   Demo mode:    docker compose up --build
#   Stop:         docker compose down
#   Rebuild:      docker compose build --no-cache
# =============================================================================

services:
  parking-system:
    build: .
    container_name: parking-demo
    ports:
      - "3080:8080"        # Access at http://localhost:3080
    environment:
      - SPRING_PROFILES_ACTIVE=demo
      # JWT_SECRET is REQUIRED and must come from your shell or a .env file
      # (see .env.example) — it must never be a literal committed here.
      # Compose's ${VAR:?err} syntax fails the run with a clear message
      # instead of silently falling back to a known, public value.
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in a .env file or your shell before running docker compose (see .env.example)}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-Admin@123}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:?Set RECAPTCHA_SITE_KEY in a .env file or your shell (see .env.example)}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:?Set RECAPTCHA_SECRET_KEY in a .env file or your shell (see .env.example)}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped
    # Auto-stop after 15 minutes (for portfolio demo)
    # Uncomment the next line for auto-shutdown:
    # stop_grace_period: 5s
